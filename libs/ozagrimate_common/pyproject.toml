[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozagrimate-common"
version = "1.0.0"
description = "Shared library for OzAgriMate services: the agreed error body and a UTC time helper."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110"]

[tool.setuptools]
packages = ["ozagrimate_common"]
